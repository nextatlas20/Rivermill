[project]
name = "rivermill"
version = "3.2.0"
description = "Webhook ingestion and delivery service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.1",
]

[project.scripts]
rivermill = "rivermill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
